spring.application.name=clinica-api

# Database configuration must be provided by the runtime environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Força o dialeto PostgreSQL para o Hibernate não travar se houver oscilação de rede
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Register the existing Supabase schema without dropping data, then apply V1/V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

